version: '3.8'
services:
  # Kita pakai inline Dockerfile langsung di compose biar lu gak perlu push ke git lagi
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-apache
        RUN apt-get update && apt-get install -y \
            git curl libpng-dev libonig-dev libxml2-dev zip unzip libzip-dev libpq-dev nodejs npm \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        RUN docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd zip
        RUN pecl install redis && docker-php-ext-enable redis
        RUN a2enmod rewrite
        RUN sed -i 's|/var/www/html|/var/www/html/public|g' /etc/apache2/sites-available/000-default.conf
        RUN echo '<Directory /var/www/html/public>\n    Options Indexes FollowSymLinks\n    AllowOverride All\n    Require all granted\n</Directory>' >> /etc/apache2/apache2.conf
        COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
        WORKDIR /var/www/html
        # ⚠️ KUNCI UTAMA: Kita copy folder src dari Git Clone Dokploy langsung ke dalem image saat build!
        COPY ./src /var/www/html
        # =========================================================================
        # ⚠️ Install dependency PHP
        # =========================================================================
        RUN composer install --no-interaction --optimize-autoloader --no-dev
        # =========================================================================
        # ⚠️ Install dependency Node & build asset frontend (Vite)
        # =========================================================================
        RUN npm install && npm run build
        # =========================================================================
        # ⚠️ Buat symlink storage biar file upload bisa diakses lewat browser
        # =========================================================================
        RUN php artisan storage:link
        RUN chown -R www-data:www-data /var/www/html && chmod -R 755 /var/www/html
        RUN if [ -d "/var/www/html/storage" ]; then chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache; fi
        USER www-data
        EXPOSE 80
        CMD ["apache2-foreground"]
    ports:
      - "8082:80"
    # =========================================================================
    # ⚠️ Daftarkan semua variabel biar dibaca sama Laravel
    # =========================================================================
    environment:
      - APP_NAME=${APP_NAME:-CakeShop}
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL}
      # Sekaligus kita daftarkan variabel database biar nanti gak error koneksi
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cake_shop
      - DB_USERNAME=cake_user
      - DB_PASSWORD=cake_password
    # =========================================================================
    # ⚠️ Volume ini penting biar file upload (foto produk dll) gak hilang
    # tiap kali image di-rebuild / redeploy
    # =========================================================================
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      - mysql
      - redis
    networks:
      - cake-network
      - dokploy-network

  wa-service:
    build: ./wa-service
    ports:
      - "3005:3000"
    volumes:
      - wa-session:/app/.wwebjs_auth
    networks:
      - cake-network

  redis:
    image: redis:7-alpine
    networks:
      - cake-network

  # MySQL Database (Ubah ke MariaDB biar enteng dan langsung auto-create di Dokploy)
  mysql:
    image: mariadb:10.11
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_DATABASE: cake_shop
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cake-network

volumes:
  mysql_data:
  wa-session:
  storage_data:

networks:
  cake-network:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
