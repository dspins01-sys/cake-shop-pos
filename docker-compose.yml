version: '3.8'

services:
  # Kita pakai inline Dockerfile langsung di compose biar lu gak perlu push ke git lagi
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-apache
        RUN apt-get update && apt-get install -y \
            git curl libpng-dev libonig-dev libxml2-dev zip unzip libzip-dev libpq-dev nodejs npm \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        RUN docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd zip
        RUN pecl install redis && docker-php-ext-enable redis
        RUN a2enmod rewrite
        RUN sed -i 's|/var/www/html|/var/www/html/public|g' /etc/apache2/sites-available/000-default.conf
        RUN echo '<Directory /var/www/html/public>\n    Options Indexes FollowSymLinks\n    AllowOverride All\n    Require all granted\n</Directory>' >> /etc/apache2/apache2.conf
        COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
        WORKDIR /var/www/html
        # ⚠️ KUNCI UTAMA: Kita copy folder src dari Git Clone Dokploy langsung ke dalem image saat build!
        COPY ./src /var/www/html
        # =========================================================================
        # ⚠️ TAMBAHKAN BARIS INI: Paksa Docker jalankan Composer Install saat build
        # =========================================================================
        RUN composer install --no-interaction --optimize-autoloader --no-dev
        RUN chown -R www-data:www-data /var/www/html && chmod -R 755 /var/www/html
        RUN if [ -d "/var/www/html/storage" ]; then chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache; fi
        USER www-data
        EXPOSE 80
        CMD ["apache2-foreground"]
    ports:
      - "8082:80"
    depends_on:
      - mysql
      - redis
    networks:
      - cake-network
      - dokploy-network

  wa-service:
    build: ./wa-service
    ports:
      - "3005:3000"
    volumes:
      - wa-session:/app/.wwebjs_auth
    networks:
      - cake-network

  redis:
    image: redis:7-alpine
    networks:
     - cake-network

  mysql:
    image: mysql:8.0
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_DATABASE: cake_shop
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cake-network

volumes:
  mysql_data:
  wa-session:

networks:
  cake-network:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
