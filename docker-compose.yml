version: '3.8'

services:
  # Web Server (Nginx) - Pintu masuk utama domain sales
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mysql
    networks:
      - cake-network

  # WhatsApp Service - Port luar dilepas total agar aman dari bentrok port 3000 Dokploy
  wa-service:
    build: ./wa-service
    ports:
      - "3005:3000" # Tetap 3005 untuk jalur internal proxy Dokploy
    volumes:
      - ./wa-service:/app
      - /app/node_modules
      - wa-session:/app/.wwebjs_auth
    networks:
      - cake-network

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    user: "1002:1002"
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - cake-network

  # Redis
  redis:
    image: redis:7-alpine
    networks:
     - cake-network

  # Horizon
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan horizon
    depends_on:
      - redis
      - mysql
    volumes:
      - ./src:/var/www/html
    networks:
      - cake-network

  # MySQL Database (Port luar 3307 dihapus agar aman dari eksploitasi luar)
  mysql:
    image: mysql:8.0
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_DATABASE: cake_shop
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cake-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - cake-network

volumes:
  mysql_data:
  wa-session:

networks:
  cake-network:
    driver: overlay
    attachable: true
  # TAMBAHKAN JARINGAN LUAR DOKPLOY
  dokploy-network:
    external: true
    attachable: true
