version: '3.8'

services:
  # Web Server (Nginx)
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      # MENGGUNAKAN NAMED VOLUME AGAR FILE TIDAK KOSONG
      - cake_src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mysql
    networks:
      - cake-network
      - dokploy-network

  # WhatsApp Service
  wa-service:
    build: ./wa-service
    ports:
      - "3005:3000"
    volumes:
      - ./wa-service:/app
      - /app/node_modules
      - wa-session:/app/.wwebjs_auth
    networks:
      - cake-network

  # PHP-FPM (Mesin Utama Laravel)
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    # USER DIHAPUS AGAR DOKPLOY BISA MENULIS FILE SOURCE DENGAN USER ROOT/WWW-DATA STANDAR
    working_dir: /var/www/html
    volumes:
      - cake_src:/var/www/html
    depends_on:
      - mysql
    networks:
      - cake-network

  # Redis
  redis:
    image: redis:7-alpine
    networks:
     - cake-network

  # Horizon
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan horizon
    depends_on:
      - redis
      - mysql
    volumes:
      - cake_src:/var/www/html
    networks:
      - cake-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_DATABASE: cake_shop
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cake-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - cake-network

volumes:
  mysql_data:
  wa-session:
  # TAMBAHKAN VOLUME KHUSUS SOURCE CODE LARAVEL
  cake_src:

networks:
  cake-network:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
