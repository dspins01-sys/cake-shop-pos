services:
  # Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: cake-nginx
    ports:
      - "8082:80"
        # - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        #- ./ssl:/etc/nginx/ssl
    depends_on:
      - php
      - mysql
    networks:
      - cake-network
  
  wa-service:
    build: ./wa-service
    container_name: cake-wa
    ports:
      - "3000:3000"
    volumes:
      - ./wa-service:/app
      - /app/node_modules
      - wa-session:/app/.wwebjs_auth
    networks:
      - cake-network
    restart: unless-stopped

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cake-php
    user: "1002:1002" 
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - cake-network
    # restart: unless-stopped  # optional

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: cake-mysql
    ports:
      - "3307:3306"  # Pake port 3307 biar nggak bentrok dengan MySQL lokal
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_DATABASE: cake_shop
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cake-network

  # phpMyAdmin (optional, buat manage database)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cake-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - cake-network

volumes:
  mysql_data:
  wa-session:

networks:
  cake-network:
    driver: bridge
